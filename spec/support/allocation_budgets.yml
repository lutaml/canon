# Allocation budgets (TODO.sota/04, W3.3): the median GC.stat
# :total_allocated_objects delta per lane, measured over 15 runs
# after one warmup. The committed number is the CEILING — the gate
# fails when a lane's median exceeds it. Object counting is exact,
# but the median shifts with the resolved engine and the Ruby
# version's stdlib (yeptris vs Psych, JSON/Psych per-version), so
# each ceiling is the OBSERVED-WORST lane plus ~10% headroom (the
# HTML and YAML lanes shift most across platforms: 189->215,
# 125->138) — a real allocation regression moves whole percentage
# points of document-scale allocations and still gates.
#
# The nokogiri-less lane merges its own overrides
# (allocation_budgets.nokogiri-less.yml).
#
# Re-baseline with CANON_BUDGET_UPDATE=1 bundle exec rspec
# spec/canon/allocation_budgets_spec.rb (after verifying the delta
# is intentional and updating the entry's comment).
format_xml: 50
format_json: 50
format_yaml: 152
format_html: 237
parse_xml: 32
equiv_xml: 507
equiv_json: 74
equiv_yaml: 105
jcs: 70
