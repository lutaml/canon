name: performance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      # One retry: the comparator trips on shared-runner noise (a real
      # regression fails the retry too — the pass condition is stricter,
      # not looser). Noise trips observed on #288, #291, #294.
      - name: Run performance benchmarks
        id: perf
        continue-on-error: true
        run: bundle exec rake performance:compare

      - name: Retry performance benchmarks once
        if: steps.perf.outcome == 'failure'
        run: bundle exec rake performance:compare
